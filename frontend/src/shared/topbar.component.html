<!-- ==========================================================================
     TOPBAR NAVIGATION (EDITORIAL & LIMPIA CONFORME A LA REFERENCIA)
     ========================================================================== -->
<header class="topnav">
  <!-- Brand Logo & Divider -->
  <div class="brand-group">
    <button class="brand" (click)="navegarInicio()" aria-label="Inicio Equinox">
      <span class="brand-icon">
        <svg viewBox="0 0 32 32" fill="none">
          <circle cx="16" cy="16" r="14" stroke="#111827" stroke-width="2.5"/>
          <path d="M16 6 A 10 10 0 0 1 26 16" fill="#111827" />
        </svg>
      </span>
      <strong>equinox</strong>
    </button>
    <div class="brand-divider"></div>
  </div>

  <!-- Desktop Navigation (Text Only with Active Underline Bar) -->
  <nav class="nav-center" aria-label="Navegación principal">
    <button *ngIf="!esFotografia" class="nav-link" (click)="state.navigate('hoy')" [class.active]="state.page === 'hoy'">
      Hoy
    </button>
    <button class="nav-link" (click)="state.navigate('clientes')" [class.active]="state.page === 'clientes'">
      Clientes
    </button>
    <button *ngIf="!esFotografia" class="nav-link" (click)="state.navigate('proyectos')" [class.active]="state.page === 'proyectos'">
      Proyectos
    </button>
    <button *ngIf="!esFotografia" class="nav-link" (click)="state.navigate('tareas')" [class.active]="state.page === 'tareas'">
      Tareas
    </button>
    <button class="nav-link" (click)="state.navigate('finanzas')" [class.active]="state.page === 'finanzas'">
      Finanzas
    </button>
  </nav>

  <!-- Right Actions: Search, Notifications, Avatar -->
  <div class="nav-actions">
    <!-- Search Pill matching reference -->
    <button class="topbar-search-pill" id="openSearch" (click)="state.openSearch()" aria-label="Buscar en Equinox (Ctrl+K)" title="Buscar (Ctrl+K)">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <span>Buscar en Equinox...</span>
    </button>

    <!-- Notifications Bell -->
    <div class="notif-wrapper" style="position: relative;">
      <button class="icon-btn notif-bell" (click)="state.toggleNotifications()" aria-label="Notificaciones" title="Notificaciones">
        <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M14 21h-4"/></svg>
        <span class="badge-dot" *ngIf="state.unreadNotifsCount > 0"></span>
      </button>

      <!-- Notifications Popover -->
      <div class="notif-popover" *ngIf="state.notificationsOpen" (click)="$event.stopPropagation()">
        <div class="notif-header">
          <strong>Notificaciones</strong>
          <span class="eyebrow" *ngIf="state.unreadNotifsCount > 0">{{ state.unreadNotifsCount }} nuevas</span>
        </div>
        <div class="notif-list">
          <div class="notif-item" *ngFor="let n of state.notificaciones" [class.unread]="!n.leida">
            <b>{{ n.titulo }}</b>
            <p>{{ n.descripcion }}</p>
            <small>{{ n.tiempo }}</small>
          </div>
          <div class="notif-empty" *ngIf="state.notificaciones.length === 0">
            <p>No tienes notificaciones pendientes.</p>
          </div>
        </div>
      </div>
    </div>

    <!-- User Avatar Badge (Rounded Square Dark) -->
    <button class="avatar-badge" (click)="state.navigate('configuracion')" aria-label="Perfil y configuración" title="Configuración">
      <span>{{ obtenerIniciales() }}</span>
    </button>

    <!-- Mobile Menu Trigger -->
    <button class="mobile-toggle" (click)="state.mobileMenuOpen = !state.mobileMenuOpen" aria-label="Menú móvil">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
  </div>
</header>
