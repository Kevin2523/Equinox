<header class="admin-topnav">
  <div class="admin-brand-group">
    <a class="admin-brand" routerLink="/admin/resumen" [attr.aria-label]="'admin.shell.brandAria' | t">
      <span class="admin-brand-icon" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none">
          <circle cx="16" cy="16" r="14" stroke="#ffffff" stroke-width="2.5"/>
          <path d="M16 6 A 10 10 0 0 1 26 16" fill="#ffffff" />
        </svg>
      </span>
      <strong>equinox</strong>
    </a>
    <span class="admin-pill">{{ 'admin.shell.badge' | t }}</span>
  </div>

  <nav class="admin-nav-center" [attr.aria-label]="'admin.shell.navAria' | t">
    <a
      *ngFor="let item of enlaces"
      [routerLink]="item.ruta"
      routerLinkActive="active"
      class="admin-nav-link">
      {{ item.clave | t }}
    </a>
  </nav>

  <div class="admin-nav-actions">
    <div class="admin-lang-wrap">
      <label class="admin-sr-only" for="admin-shell-lang">{{ 'admin.shell.idiomaLabel' | t }}</label>
      <select
        #adminLangSelect
        id="admin-shell-lang"
        class="admin-lang-select"
        [value]="i18n.locale()"
        [disabled]="guardandoIdioma || cerrandoSesion"
        [attr.aria-label]="'admin.shell.idiomaLabel' | t"
        (change)="cambiarIdioma($any($event.target).value, adminLangSelect)">
        <option *ngFor="let lang of i18n.idiomasDisponibles" [value]="lang.codigo">
          {{ lang.etiquetaCorta }} · {{ lang.nombreNativo }}
        </option>
      </select>
    </div>

    <div class="admin-user-chip" *ngIf="auth.sesion?.usuario as usuario">
      <span class="admin-avatar" aria-hidden="true">{{ obtenerIniciales() }}</span>
      <div class="admin-user-meta">
        <strong>{{ usuario.nombre }} {{ usuario.apellido || '' }}</strong>
        <small>{{ usuario.correo }}</small>
      </div>
    </div>

    <button
      type="button"
      class="admin-logout-btn"
      (click)="cerrarSesion()"
      [disabled]="cerrandoSesion">
      {{ (cerrandoSesion ? 'admin.shell.saliendo' : 'admin.shell.cerrarSesion') | t }}
    </button>

    <button
      type="button"
      class="admin-mobile-toggle"
      (click)="menuMovilAbierto = !menuMovilAbierto"
      [attr.aria-expanded]="menuMovilAbierto"
      [attr.aria-label]="'admin.shell.abrirMenuAria' | t">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
  </div>
</header>

<div *ngIf="errorIdioma" class="admin-lang-error" role="alert">
  {{ errorIdioma }}
</div>

<div class="admin-mobile-drawer" *ngIf="menuMovilAbierto">
  <nav [attr.aria-label]="'admin.shell.navMovilAria' | t" class="admin-mobile-nav">
    <a
      *ngFor="let item of enlaces"
      [routerLink]="item.ruta"
      routerLinkActive="active"
      class="admin-mobile-link"
      (click)="menuMovilAbierto = false">
      {{ item.clave | t }}
    </a>
  </nav>
</div>

<main class="admin-workspace">
  <router-outlet></router-outlet>
</main>
