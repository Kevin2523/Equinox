<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title desc">
  <title id="title">Equinox: flujo de invitación y acceso del cliente</title>
  <desc id="desc">Muestra cómo el freelancer invita al cliente, este crea su cuenta y accede a su portal.</desc>
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#17213A" flood-opacity=".10"/></filter>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1l10 5-10 5z" fill="#667085"/></marker>
    <style>.f{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#17213A}.num{font-size:24px;font-weight:900}.title{font-size:25px;font-weight:800}.body{font-size:18px;fill:#667085}.arrow{stroke:#667085;stroke-width:3;fill:none;marker-end:url(#arr)}</style>
  </defs>
  <rect width="1800" height="1050" fill="#F7F5EF"/>
  <circle cx="1660" cy="80" r="220" fill="#9B6BE8" opacity=".08"/><circle cx="80" cy="960" r="220" fill="#3C6FF0" opacity=".08"/>
  <text x="90" y="75" class="f" font-size="17" font-weight="800" letter-spacing="2" fill="#8051CE">EXPERIENCIA DEL CLIENTE</text>
  <text x="90" y="132" class="f" font-size="48" font-weight="850">De la invitación al portal personal</text>
  <text x="90" y="173" class="f body" font-size="21">El cliente crea una cuenta una sola vez y vuelve cuando quiera con sus credenciales.</text>

  <!-- lanes -->
  <rect x="80" y="225" width="1640" height="265" rx="30" fill="#E9EFFF" opacity=".72"/>
  <rect x="80" y="515" width="1640" height="375" rx="30" fill="#F1EAFC" opacity=".72"/>
  <text x="112" y="266" class="f" font-size="18" font-weight="800" fill="#2D59C7">FREELANCER</text>
  <text x="112" y="556" class="f" font-size="18" font-weight="800" fill="#7145B8">CLIENTE</text>

  <!-- arrows -->
  <path d="M380 363H500" class="arrow"/><path d="M800 363H900" class="arrow"/>
  <path d="M1050 430C1050 535 310 510 310 630" class="arrow"/>
  <path d="M460 710H570" class="arrow"/><path d="M870 710H980" class="arrow"/><path d="M1280 710H1390" class="arrow"/>

  <!-- freelancer cards -->
  <g filter="url(#sh)"><rect x="150" y="295" width="230" height="135" rx="22" fill="white" stroke="#3C6FF0" stroke-width="3"/><rect x="500" y="295" width="300" height="135" rx="22" fill="white" stroke="#3C6FF0" stroke-width="3"/><rect x="900" y="295" width="300" height="135" rx="22" fill="white" stroke="#3C6FF0" stroke-width="3"/></g>
  <circle cx="190" cy="330" r="22" fill="#3C6FF0"/><text x="190" y="338" text-anchor="middle" font-family="Inter,Segoe UI,Arial" class="num" fill="white">1</text><text x="225" y="340" class="f title">Crea cliente</text><text x="180" y="382" class="f body">Registra sus datos</text><text x="180" y="407" class="f body">y empresa.</text>
  <circle cx="540" cy="330" r="22" fill="#3C6FF0"/><text x="540" y="338" text-anchor="middle" font-family="Inter,Segoe UI,Arial" class="num" fill="white">2</text><text x="575" y="340" class="f title">Crea proyecto</text><text x="530" y="382" class="f body">Asocia alcance, fechas,</text><text x="530" y="407" class="f body">tareas y archivos.</text>
  <circle cx="940" cy="330" r="22" fill="#3C6FF0"/><text x="940" y="338" text-anchor="middle" font-family="Inter,Segoe UI,Arial" class="num" fill="white">3</text><text x="975" y="340" class="f title">Envía invitación</text><text x="930" y="382" class="f body">Equinox manda un enlace</text><text x="930" y="407" class="f body">seguro al correo.</text>

  <!-- client cards -->
  <g filter="url(#sh)"><rect x="160" y="630" width="300" height="160" rx="22" fill="white" stroke="#9B6BE8" stroke-width="3"/><rect x="570" y="630" width="300" height="160" rx="22" fill="white" stroke="#9B6BE8" stroke-width="3"/><rect x="980" y="630" width="300" height="160" rx="22" fill="white" stroke="#9B6BE8" stroke-width="3"/><rect x="1390" y="630" width="260" height="160" rx="22" fill="white" stroke="#9B6BE8" stroke-width="3"/></g>
  <circle cx="200" cy="668" r="22" fill="#9B6BE8"/><text x="200" y="676" text-anchor="middle" font-family="Inter,Segoe UI,Arial" class="num" fill="white">4</text><text x="235" y="678" class="f title">Acepta</text><text x="190" y="720" class="f body">Verifica que reconoce</text><text x="190" y="746" class="f body">al freelancer y proyecto.</text>
  <circle cx="610" cy="668" r="22" fill="#9B6BE8"/><text x="610" y="676" text-anchor="middle" font-family="Inter,Segoe UI,Arial" class="num" fill="white">5</text><text x="645" y="678" class="f title">Crea su cuenta</text><text x="600" y="720" class="f body">Define contraseña</text><text x="600" y="746" class="f body">y confirma su correo.</text>
  <circle cx="1020" cy="668" r="22" fill="#9B6BE8"/><text x="1020" y="676" text-anchor="middle" font-family="Inter,Segoe UI,Arial" class="num" fill="white">6</text><text x="1055" y="678" class="f title">Inicia sesión</text><text x="1010" y="720" class="f body">Entra desde cualquier</text><text x="1010" y="746" class="f body">dispositivo autorizado.</text>
  <circle cx="1430" cy="668" r="22" fill="#9B6BE8"/><text x="1430" y="676" text-anchor="middle" font-family="Inter,Segoe UI,Arial" class="num" fill="white">7</text><text x="1465" y="678" class="f title">Usa el portal</text><text x="1420" y="720" class="f body">Avances, archivos,</text><text x="1420" y="746" class="f body">feedback y facturas.</text>

  <rect x="250" y="936" width="1300" height="58" rx="29" fill="#17213A"/>
  <text x="900" y="972" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="20" font-weight="700" fill="white">Si el cliente ya tiene cuenta, una nueva invitación solo añade el proyecto a su portal existente.</text>
</svg>