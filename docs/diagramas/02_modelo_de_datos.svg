<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">Equinox: modelo de datos simplificado</title>
  <desc id="desc">Diagrama de entidades y relaciones para usuarios, organizaciones, clientes, proyectos y operaciones.</desc>
  <defs>
    <filter id="s" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#12213A" flood-opacity=".09"/></filter>
    <marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1l9 4.5L1 10z" fill="#738096"/></marker>
    <style>
      .font{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#17213A}.box{fill:#fff;stroke-width:3;filter:url(#s)}.name{font-size:24px;font-weight:800}.desc{font-size:16px;fill:#68738A}.group{font-size:16px;font-weight:800;letter-spacing:2px}.rel{fill:none;stroke:#738096;stroke-width:2.5;marker-end:url(#a)}.rel2{fill:none;stroke:#A3ACBC;stroke-width:2;stroke-dasharray:7 7;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1800" height="1200" fill="#F7F5EF"/>
  <path d="M0 195H1800M0 640H1800" stroke="#E5E1D7" stroke-width="1"/>
  <text x="90" y="72" class="font group" fill="#3C6FF0">MODELO DE DATOS PROPUESTO</text>
  <text x="90" y="128" class="font" font-size="48" font-weight="850">Así se organiza la información de Equinox</text>
  <text x="90" y="168" class="font desc" font-size="20">Versión simplificada para aprobar la lógica antes de modificar PostgreSQL.</text>

  <!-- relationship lines behind boxes -->
  <path d="M285 355H455" class="rel"/><path d="M715 355H880" class="rel"/>
  <path d="M1140 355H1310" class="rel"/><path d="M1010 430V555" class="rel"/>
  <path d="M1440 430V555" class="rel"/><path d="M1010 430C1010 505 585 490 585 555" class="rel"/>
  <path d="M715 625H880" class="rel"/><path d="M1310 625C1210 500 800 500 715 625" class="rel2"/>
  <path d="M1010 695V815" class="rel"/><path d="M1010 695C1010 760 270 755 270 815" class="rel2"/>
  <path d="M1010 695C1010 760 575 760 575 815" class="rel2"/>
  <path d="M1010 695C1010 760 880 760 880 815" class="rel2"/>
  <path d="M1010 695C1010 760 1190 760 1190 815" class="rel2"/>
  <path d="M1010 695C1010 760 1490 760 1490 815" class="rel2"/>

  <!-- section labels -->
  <rect x="90" y="220" width="340" height="35" rx="17" fill="#E9EFFF"/><text x="110" y="244" class="font group" fill="#2D59C7">IDENTIDAD Y NEGOCIO</text>
  <rect x="90" y="515" width="300" height="35" rx="17" fill="#E4F6ED"/><text x="110" y="539" class="font group" fill="#13734F">TRABAJO PRINCIPAL</text>
  <rect x="90" y="775" width="350" height="35" rx="17" fill="#F1EAFC"/><text x="110" y="799" class="font group" fill="#7145B8">OPERACIÓN DEL PROYECTO</text>

  <!-- top row -->
  <g><rect x="90" y="285" width="195" height="145" rx="22" class="box" stroke="#3C6FF0"/><text x="120" y="333" class="font name">Usuario</text><text x="120" y="365" class="font desc">Cuenta y credenciales</text><text x="120" y="393" class="font desc">Freelancer, colaborador</text><text x="120" y="417" class="font desc">o cliente</text></g>
  <g><rect x="455" y="285" width="260" height="145" rx="22" class="box" stroke="#3C6FF0"/><text x="485" y="333" class="font name">Membresía</text><text x="485" y="365" class="font desc">Une usuario y negocio</text><text x="485" y="393" class="font desc">Rol: propietario</text><text x="485" y="417" class="font desc">o colaborador</text></g>
  <g><rect x="880" y="285" width="260" height="145" rx="22" class="box" stroke="#F0BC3D"/><text x="910" y="333" class="font name">Organización</text><text x="910" y="365" class="font desc">Estudio del freelancer</text><text x="910" y="393" class="font desc">Marca, moneda</text><text x="910" y="417" class="font desc">y configuración</text></g>
  <g><rect x="1310" y="285" width="260" height="145" rx="22" class="box" stroke="#9B6BE8"/><text x="1340" y="333" class="font name">Invitación</text><text x="1340" y="365" class="font desc">Correo, token y estado</text><text x="1340" y="393" class="font desc">Expira al registrarse</text><text x="1340" y="417" class="font desc">el cliente</text></g>

  <!-- middle row -->
  <g><rect x="455" y="555" width="260" height="140" rx="22" class="box" stroke="#22A06B"/><text x="485" y="603" class="font name">Cliente</text><text x="485" y="635" class="font desc">Persona o empresa</text><text x="485" y="663" class="font desc">contratada por el estudio</text></g>
  <g><rect x="880" y="555" width="260" height="140" rx="22" class="box" stroke="#22A06B"/><text x="910" y="603" class="font name">Proyecto</text><text x="910" y="635" class="font desc">Trabajo, estado, fechas</text><text x="910" y="663" class="font desc">y presupuesto</text></g>
  <g><rect x="1310" y="555" width="260" height="140" rx="22" class="box" stroke="#9B6BE8"/><text x="1340" y="603" class="font name">Acceso cliente</text><text x="1340" y="635" class="font desc">Une la cuenta con</text><text x="1340" y="663" class="font desc">su ficha de cliente</text></g>

  <!-- bottom row -->
  <g><rect x="150" y="815" width="240" height="135" rx="22" class="box" stroke="#9B6BE8"/><text x="180" y="863" class="font name">Tareas</text><text x="180" y="895" class="font desc">Trabajo pendiente</text><text x="180" y="922" class="font desc">y responsables</text></g>
  <g><rect x="455" y="815" width="240" height="135" rx="22" class="box" stroke="#9B6BE8"/><text x="485" y="863" class="font name">Hitos</text><text x="485" y="895" class="font desc">Etapas visibles</text><text x="485" y="922" class="font desc">del avance</text></g>
  <g><rect x="760" y="815" width="240" height="135" rx="22" class="box" stroke="#9B6BE8"/><text x="790" y="863" class="font name">Archivos</text><text x="790" y="895" class="font desc">Metadatos y enlace</text><text x="790" y="922" class="font desc">de almacenamiento</text></g>
  <g><rect x="1070" y="815" width="240" height="135" rx="22" class="box" stroke="#9B6BE8"/><text x="1100" y="863" class="font name">Comentarios</text><text x="1100" y="895" class="font desc">Conversación entre</text><text x="1100" y="922" class="font desc">freelancer y cliente</text></g>
  <g><rect x="1370" y="815" width="240" height="135" rx="22" class="box" stroke="#E06E62"/><text x="1400" y="863" class="font name">Facturas</text><text x="1400" y="895" class="font desc">Cobros, vencimiento</text><text x="1400" y="922" class="font desc">y estado del pago</text></g>

  <!-- explanations -->
  <g filter="url(#s)"><rect x="90" y="1010" width="1620" height="120" rx="24" fill="#17213A"/></g>
  <circle cx="145" cy="1070" r="26" fill="#F1D55D"/><text x="145" y="1078" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="25" font-weight="900" fill="#17213A">1</text>
  <text x="190" y="1058" font-family="Inter,Segoe UI,Arial" font-size="20" font-weight="750" fill="white">Una cuenta de cliente no reemplaza su ficha comercial.</text>
  <text x="190" y="1090" font-family="Inter,Segoe UI,Arial" font-size="18" fill="#C7D0E1">La ficha guarda la relación con el negocio; la cuenta permite iniciar sesión y usar el portal.</text>
  <circle cx="1000" cy="1070" r="26" fill="#9B6BE8"/><text x="1000" y="1078" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="25" font-weight="900" fill="white">2</text>
  <text x="1045" y="1058" font-family="Inter,Segoe UI,Arial" font-size="20" font-weight="750" fill="white">PostgreSQL guarda datos; los archivos viven aparte.</text>
  <text x="1045" y="1090" font-family="Inter,Segoe UI,Arial" font-size="18" fill="#C7D0E1">La base conserva nombre, tamaño, permisos y URL del archivo.</text>
</svg>