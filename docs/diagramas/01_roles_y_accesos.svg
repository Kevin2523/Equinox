<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Equinox: roles y accesos</title>
  <desc id="desc">Explica qué puede hacer el propietario, colaborador y cliente dentro de Equinox.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#17213A" flood-opacity="0.10"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1l10 5-10 5z" fill="#68738A"/></marker>
    <style>
      .t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#15213B}.muted{fill:#667085}.small{font-size:20px}.label{font-size:18px;font-weight:700;letter-spacing:1.8px}.card-title{font-size:30px;font-weight:750}.body{font-size:21px}.pill{font-size:17px;font-weight:700}.line{fill:none;stroke:#68738A;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#F6F4EE"/>
  <circle cx="1450" cy="90" r="180" fill="#F1D55D" opacity=".22"/><circle cx="90" cy="900" r="210" fill="#3C6FF0" opacity=".08"/>
  <text x="90" y="82" class="t label" fill="#3C6FF0">MODELO PROPUESTO</text>
  <text x="90" y="135" class="t" font-size="48" font-weight="800">¿Quién entra a Equinox y qué puede hacer?</text>
  <text x="90" y="175" class="t muted small">Tres experiencias separadas, una sola fuente de información.</text>

  <path d="M800 318V245" class="line"/>
  <rect x="590" y="210" width="420" height="110" rx="26" fill="#17213A" filter="url(#shadow)"/>
  <circle cx="655" cy="265" r="28" fill="#F1D55D"/><circle cx="647" cy="265" r="12" fill="#3C6FF0"/>
  <text x="705" y="255" font-family="Inter,Segoe UI,Arial" font-size="25" font-weight="800" fill="white">Equinox</text>
  <text x="705" y="284" font-family="Inter,Segoe UI,Arial" font-size="18" fill="#C7D0E1">Autenticación y permisos por rol</text>

  <path d="M800 320C800 370 320 360 320 420" class="line"/>
  <path d="M800 320V420" class="line"/>
  <path d="M800 320C800 370 1280 360 1280 420" class="line"/>

  <g filter="url(#shadow)">
    <rect x="80" y="420" width="470" height="430" rx="30" fill="#FFFFFF"/>
    <rect x="565" y="420" width="470" height="430" rx="30" fill="#FFFFFF"/>
    <rect x="1050" y="420" width="470" height="430" rx="30" fill="#FFFFFF"/>
  </g>

  <rect x="80" y="420" width="470" height="12" rx="6" fill="#3C6FF0"/>
  <circle cx="145" cy="500" r="34" fill="#E9EFFF"/><path d="M130 510c7-18 23-18 30 0M145 485a10 10 0 1 0 0-20 10 10 0 0 0 0 20" fill="none" stroke="#3C6FF0" stroke-width="4" stroke-linecap="round"/>
  <text x="200" y="492" class="t card-title">Propietario</text><text x="200" y="522" class="t muted small">Freelancer dueño del estudio</text>
  <rect x="116" y="565" width="190" height="38" rx="19" fill="#E9EFFF"/><text x="138" y="591" class="t pill" fill="#2D59C7">CONTROL COMPLETO</text>
  <text x="116" y="648" class="t body">• Gestiona clientes y proyectos</text>
  <text x="116" y="695" class="t body">• Invita colaboradores y clientes</text>
  <text x="116" y="742" class="t body">• Configura marca y portal</text>
  <text x="116" y="789" class="t body">• Administra facturas y permisos</text>

  <rect x="565" y="420" width="470" height="12" rx="6" fill="#22A06B"/>
  <circle cx="630" cy="500" r="34" fill="#E4F6ED"/><path d="M612 510c6-15 19-17 27-6M628 486a9 9 0 1 0 0-18 9 9 0 0 0 0 18M642 508c4-11 14-13 21-7M651 489a7 7 0 1 0 0-14 7 7 0 0 0 0 14" fill="none" stroke="#16845A" stroke-width="4" stroke-linecap="round"/>
  <text x="685" y="492" class="t card-title">Colaborador</text><text x="685" y="522" class="t muted small">Miembro del equipo del freelancer</text>
  <rect x="601" y="565" width="190" height="38" rx="19" fill="#E4F6ED"/><text x="623" y="591" class="t pill" fill="#13734F">ACCESO ASIGNADO</text>
  <text x="601" y="648" class="t body">• Participa en proyectos permitidos</text>
  <text x="601" y="695" class="t body">• Actualiza tareas e hitos</text>
  <text x="601" y="742" class="t body">• Sube archivos y comenta</text>
  <text x="601" y="789" class="t body">• No controla facturación ni marca</text>

  <rect x="1050" y="420" width="470" height="12" rx="6" fill="#9B6BE8"/>
  <circle cx="1115" cy="500" r="34" fill="#F1EAFC"/><path d="M1098 507h34v-25h-34zM1098 489l17-13 17 13M1107 507v-12h16v12" fill="none" stroke="#8051CE" stroke-width="4" stroke-linejoin="round"/>
  <text x="1170" y="492" class="t card-title">Cliente</text><text x="1170" y="522" class="t muted small">Persona invitada al portal</text>
  <rect x="1086" y="565" width="205" height="38" rx="19" fill="#F1EAFC"/><text x="1108" y="591" class="t pill" fill="#7145B8">PORTAL PERSONAL</text>
  <text x="1086" y="648" class="t body">• Entra con correo y contraseña</text>
  <text x="1086" y="695" class="t body">• Ve sus propios proyectos</text>
  <text x="1086" y="742" class="t body">• Descarga archivos autorizados</text>
  <text x="1086" y="789" class="t body">• Comenta, aprueba y ve facturas</text>

  <rect x="90" y="900" width="1420" height="48" rx="24" fill="#E9E7DF"/>
  <text x="800" y="931" text-anchor="middle" class="t small" font-weight="650">Regla central: cada persona solo ve la organización, clientes y proyectos para los que tiene permiso.</text>
</svg>